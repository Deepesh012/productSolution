name: ProductSolution CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: productsolution
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d productsolution"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests and build application
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/productsolution
          TEST_DB_USERNAME: postgres
          TEST_DB_PASSWORD: postgres
        run: mvn clean package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/deepesh012/productsolution:latest .

      - name: Push Docker image to GHCR
        run: docker push ghcr.io/deepesh012/productsolution:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Pulling latest Docker image..."
            docker pull ghcr.io/deepesh012/productsolution:latest

            echo "Stopping old application..."
            docker stop productsolution-app || true

            echo "Removing old application..."
            docker rm productsolution-app || true

            echo "Starting new application..."
            docker run -d \
              --name productsolution-app \
              --network productsolution-network \
              -p 8200:8200 \
              ghcr.io/deepesh012/productsolution:latest

            echo "Waiting for application..."
            sleep 20

            echo "Checking container..."
            docker ps --filter "name=productsolution-app"

            echo "Checking application health..."
            curl -f http://localhost:8200/actuator/health

            echo "Deployment completed successfully!"
