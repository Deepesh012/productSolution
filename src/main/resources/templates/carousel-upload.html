<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8" />
    <title>AVT Fastners</title>
    
</head>
<body>
    <section th:fragment="section">
      <div class="container">
    <div class="card p-4">
        <h3 class="text-center mb-4 text-primary fw-bold">🎡 Manage Carousel Images</h3>

        <!-- Upload Form -->
        <form th:action="@{/carousel/upload}" method="post" enctype="multipart/form-data"
              class="text-center mb-4">
            <div class="mb-3">
                <input class="form-control" type="file" name="file" accept="image/*" required>
            </div>
            <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-upload"></i> Upload New Image
            </button>
        </form>

        <h5 class="fw-bold mb-3 text-secondary">Current Carousel Images</h5>

        <!-- Vertical Image List -->
        <div class="d-flex flex-column">
            <div th:each="img : ${carouselImages}" class="position-relative border rounded mb-3" 
                 style="width: 100%; max-width: 500px; height: 120px; margin: auto; overflow: hidden;">
                
                <!-- Carousel Image -->
                <img th:src="@{${img.imageUrl}}" alt="Carousel Image"
                     style="width: 100%; height: 100%; object-fit: cover; display: block;">

                <!-- Delete Button Overlay -->
                <form th:action="@{/carousel/delete/{id}(id=${img.id})}" method="post"
                      class="position-absolute" 
                      style="top: 5px; right: 5px;">
                    <button type="submit" class="btn btn-danger btn-sm">&times;</button>
                </form>
            </div>
        </div>

    </div>
</div>

    </section>
    
</body>
</html>
