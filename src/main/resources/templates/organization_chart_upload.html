<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::Layout(~{::section})}">
<head>
  <title>Upload Organization Chart</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Bootstrap CSS & Icons -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  
</head>
<body>
<section th:fragment="section">
  <div class="container my-5 d-flex justify-content-center">
  <div class="card shadow-lg p-4" style="width: 420px; border-radius: 15px;">

    <div class="card-body text-center">
      <h3 class="mb-4 text-primary fw-bold">Upload Organization Chart</h3>

      <!-- Upload Form -->
      <form th:action="@{/organization/upload}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <input class="form-control" type="file" name="file" accept=".png,.jpg,.jpeg,.pdf" required />
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
          <i class="bi bi-upload"></i> Upload
        </button>
      </form>

      <!-- Message -->
      <p class="mt-3 text-success fw-medium" th:text="${message}"></p>

      
    </div>
  </div>
</div>



    
  </section>
</body>
</html>
