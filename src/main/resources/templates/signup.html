<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Register</title>

<link rel="stylesheet" href="/css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* =========================
   PAGE BACKGROUND
========================= */

body{
background:
linear-gradient(rgba(255,255,255,0.85), rgba(255,255,255,0.85)),
url('/img/architects.jpg') no-repeat center center fixed;
background-size:cover;
margin:0;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* =========================
   REGISTER CARD
========================= */

.register-card{
background:#fff;
padding:30px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
width:100%;
max-width:600px;
margin:20px auto;
box-sizing:border-box;
}
@media (max-width:768px){

.register-card{
max-width:90%;
margin:15px auto;
padding:20px;
}

}


/* TITLE */

.register-card h1{
font-size:1.8rem;
margin-bottom:20px;
color:#004080;
font-weight:bold;
}

/* FORM FOCUS */

.form-control:focus{
border-color:#009688;
box-shadow:0 0 0 0.2rem rgba(0,150,136,.25);
}

/* BUTTONS */

.btn-custom{
background:#009688;
color:white;
border:none;
}

.btn-custom:hover{
background:#00796b;
}

.btn-reset{
background:#ffc107;
color:black;
border:none;
}

.btn-reset:hover{
background:#e0a800;
}

/* =========================
   MOBILE DESIGN
========================= */

@media (max-width:768px){

.register-card{
margin:15px;
padding:20px;
}

.register-card h1{
font-size:1.5rem;
}

}

</style>
</head>


<body>

<!-- HEADER -->

<div th:replace="~{fragments/header :: siteHeader}"></div>


<!-- REGISTER CARD -->

<div class="register-card">

<div class="text-center mb-3">

<img src="/img/avtfast_logo.png" alt="Register Icon" style="width:60px">

<h1>Register Here !!</h1>

</div>


<!-- ALERT -->

<div th:if="${session.message}"
th:classappend="${session.message.type}"
class="alert text-center"
role="alert">

<p th:text="${session.message.content}"></p>

</div>


<!-- REGISTER FORM -->

<form th:action="@{/do_register}" method="post" th:object="${user}" novalidate>

<!-- NAME -->

<div class="mb-3">

<label for="name_field" class="form-label">Your Name</label>

<input type="text"
id="name_field"
name="name"
class="form-control"
th:classappend="${#fields.hasErrors('name') ? 'is-invalid':''}"
placeholder="Enter here.."
th:value="${user.name}"
required>

<div class="invalid-feedback"
th:each="e : ${#fields.errors('name')}"
th:text="${e}"></div>

</div>


<!-- EMAIL -->

<div class="mb-3">

<label for="email_field" class="form-label">Your Email</label>

<input type="email"
id="email_field"
name="email"
class="form-control"
placeholder="eg: abc@gmail.com"
th:value="${user.email}"
required>

</div>


<!-- PASSWORD -->

<div class="mb-3">

<label for="password_field" class="form-label">Your Password</label>

<input type="password"
id="password_field"
name="password"
class="form-control"
placeholder="Enter password"
required>

</div>


<!-- ABOUT -->

<div class="mb-3">

<label class="form-label">About You</label>

<textarea name="about"
rows="4"
class="form-control"
placeholder="Enter something about yourself..."
th:text="${user.about}"></textarea>

</div>


<!-- TERMS -->

<div class="form-check mb-3">

<input type="checkbox"
class="form-check-input"
id="agreement"
name="agreement">

<label for="agreement"
class="form-check-label">

Accept terms and conditions

</label>

</div>


<!-- BUTTONS -->

<div class="d-flex justify-content-between">

<button type="submit" class="btn btn-custom">
Submit
</button>

<button type="reset" class="btn btn-reset">
Reset
</button>

</div>

</form>

</div>


<!-- FOOTER -->

<footer style="background:white;color:black;text-align:center;padding:20px 10px;margin-top:auto;">

<p style="margin:0;font-size:0.95rem;">

&copy; 2025 <strong>AVT Fastners Pvt. Ltd.</strong>. All rights reserved.

</p>

</footer>


<!-- HAMBURGER SCRIPT -->

<script>

document.addEventListener("DOMContentLoaded", function(){

const menuBtn = document.getElementById("mobile-menu");
const navList = document.getElementById("nav-list");

if(menuBtn){
menuBtn.addEventListener("click", function(){
navList.classList.toggle("active");
});
}

/* MOBILE DROPDOWN */

const dropdownLinks = document.querySelectorAll(".dropdown > a");

dropdownLinks.forEach(link => {

link.addEventListener("click", function(e){

if(window.innerWidth <= 768){

e.preventDefault();

const submenu = this.nextElementSibling;

if(submenu){
submenu.classList.toggle("show");
}

}

});

});

});

</script>

</body>
</html>
