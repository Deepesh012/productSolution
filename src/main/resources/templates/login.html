<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login Page</title>

<link rel="stylesheet" href="/css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* PAGE LAYOUT */

body.login-page{
display:flex;
flex-direction:column;
height:100vh;
margin:0;
background:#f9f9f9;
}

main{
flex:1;
display:flex;
align-items:center;
justify-content:center;
padding:5px;
}

/* REMOVE LARGE BOOTSTRAP SPACING */

.row{
margin:0;
}

.card-body{
padding:15px;
}

/* LOGIN IMAGE */

.login-banner{
width:100%;
height:320px;
object-fit:cover;
}

/* CARD */

.card{
border-radius:10px;
}

/* BUTTON */

.custom-btn{
background:#6495ED !important;
border:none;
color:white;
}

.custom-btn:hover{
background:#004080 !important;
}

/* MOBILE */

@media (max-width:768px){

.login-banner{
height:180px;
width:90%;
display:block;
margin:auto;
}

}


</style>
</head>


<body class="login-page">

<!-- HEADER -->

<div th:replace="~{fragments/header :: siteHeader}"></div>


<!-- LOGIN SECTION -->

<main>

<section class="container-fluid">

<div class="row align-items-center justify-content-center">

<!-- IMAGE -->

<div class="col-md-6 p-0">

<img src="/img/banner.jpg"
class="login-banner"
alt="Login Banner">

</div>


<!-- LOGIN FORM -->

<div class="col-md-5">

<form th:action="@{/dologin}" method="post" class="card shadow-sm">

<div class="card-body">

<div th:if="${param.error}" class="alert alert-danger mb-2">
Invalid Username or Password
</div>

<div th:if="${param.logout}" class="alert alert-success mb-2">
You have been logged out
</div>


<div class="mb-2">

<label style="color:#004080">Username</label>

<input type="text"
name="username"
class="form-control"
required>

</div>


<div class="mb-2">

<label style="color:#004080">Password</label>

<input type="password"
name="password"
class="form-control"
required>

</div>


<div class="d-flex justify-content-between align-items-center mb-2">

<div class="form-check">

<input type="checkbox"
class="form-check-input"
id="remember-me"
name="remember-me">

<label for="remember-me" style="color:#004080">
Remember me
</label>

</div>

<a href="#">Forgot password?</a>

</div>


<div class="text-center">

<input type="submit"
class="btn custom-btn px-4"
value="Login">

<p class="mt-2 mb-0">

Don't have account?

<a th:href="@{/signup}" class="link-danger">
Register
</a>

</p>

</div>

</div>
</form>

</div>

</div>

</section>

</main>


<!-- FOOTER -->

<div th:replace="~{fragments/footer :: footer}"></div>


<script>

document.addEventListener("DOMContentLoaded", function(){

const menuBtn = document.getElementById("mobile-menu");
const navList = document.getElementById("nav-list");

if(menuBtn){
menuBtn.addEventListener("click", function(){
navList.classList.toggle("active");
});
}

});

</script>

</body>
</html>
