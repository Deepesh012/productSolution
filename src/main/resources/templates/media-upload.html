<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8" />
    <title>AVT Fastners</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .upload-container {
            max-width: 700px;
            margin: 40px auto;
        }
        .upload-card {
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background: #fff;
        }
        .upload-card h2 {
            color: #004080;
            font-weight: 600;
        }
        label {
            font-weight: 500;
            margin-top: 10px;
        }
        textarea {
            resize: none;
        }
        .btn-custom {
            background-color: #004080;
            color: white;
            font-weight: 500;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-custom:hover {
            background-color: #002b59;
        }
        .back-link a {
            color: #004080;
            font-weight: 500;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
<section th:fragment="section">
    <div class="container upload-container">
        <div class="card upload-card p-4">
            <h2 class="text-center mb-4" th:text="'Upload ' + ${type} + ' Content'">Upload Banner</h2>

            
            <!-- ✅ Upload Form -->
            <form method="post" enctype="multipart/form-data" action="/media/upload">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="type" th:value="${type}" />

                <div class="mb-3">
                    <label class="form-label">Choose Image:</label>
                    <input type="file" class="form-control" name="file" accept="image/*" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Heading:</label>
                    <input type="text" class="form-control" name="heading"
                           placeholder="Enter heading..."
                           th:value="${existingMedia != null ? existingMedia.heading : ''}" />
                </div>

                <div class="mb-3">
                    <label class="form-label">Description:</label>
                    <textarea class="form-control" rows="5" name="description"
                              placeholder="Enter description..."
                              th:utext="${existingMedia != null ? existingMedia.description : ''}"></textarea>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold shadow-sm">Upload & Save</button>

                </div>
            </form>

            <div class="text-center back-link mt-4">
                <a href="/user/dashboard"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
