<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::Layout(~{::section})}">
<head>
<meta charset="UTF-8" />
<title>Add Products</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
.fade-out {
  opacity: 0;
  transition: opacity 0.5s ease;
}
</style>

</head>
<body>

	<section th:fragment="section" class="m-3">
		<section>

			<div class="card">
				<div class="card-body">
					<h1 class="text-center">Add Fastners</h1>

					<div class="container-fluid mt-1">
						<div class="row">
							<div class="col-md-10 offset-md-1">
<div th:if="${successMessage}"
     id="successMessage"
     class="alert alert-success text-center alertBox mt-3"
     role="alert"
     th:text="${successMessage}">
</div>

<div th:if="${errorMessage}"
     id="errorMessage"
     class="alert alert-danger text-center alertBox mt-3"
     role="alert"
     th:text="${errorMessage}">
</div>


								<form action="#" th:object="${fastners}"
									enctype="multipart/form-data" method="post"
									th:action="@{/product/process-fastners}" class="mt-2">

									<!-- CSRF token -->
									<input type="hidden" th:name="${_csrf.parameterName}"
										th:value="${_csrf.token}" />

									<!-- name -->
									<div class="input-group">
										<div class="input-group-prepend">
											<div class="input-group-text">
												<i class="bi bi-plus"></i>

											</div>
										</div>
										<input type="text" name="name" id="name"
											placeholder="Enter name Here..." class="form-control" />
									</div>

									<!-- content -->
									<div class="input-group mt-2">
										<div class="input-group-prepend">
											<div class="input-group-text">
												<i class="bi bi-paragraph"></i>

											</div>
										</div>
										<input type="text" name="content" id="content"
											placeholder="Enter Content Here..." class="form-control" />
									</div>

									<!-- Heading 1 -->
									<div class="input-group mt-2">
										<div class="input-group-prepend">
											<div class="input-group-text">
												<i class="bi bi-type-h1"></i>

											</div>
										</div>
										<input type="text" name="heading1" id="heading1"
											placeholder="Heading 1" class="form-control" />
									</div>

									<!-- Description 1 -->
									<div class="form-group mt-3">
										<textarea placeholder="Description 1" name="description1"
											id="description1" class="form-control" rows="6"></textarea>
									</div>

									<!-- Image 1 -->
									<div class="form-group">
										<label>Upload Image 1:</label> <input type="file"
											name="image1File" class="form-control">
									</div>

									<!-- Heading 2 -->
									<div class="input-group mt-2">
										<div class="input-group-prepend">
											<div class="input-group-text">
												<i class="bi bi-type-h2"></i>

											</div>
										</div>
										<input type="text" name="heading2" id="heading2"
											placeholder="Heading 2" class="form-control" />
									</div>

									<!-- Description 2 -->
									<div class="form-group mt-3">
										<textarea placeholder="Description 2" name="description2"
											id="description2" class="form-control" rows="6"></textarea>
									</div>

									<!-- Image 2 -->
									<div class="form-group">
										<label>Upload Image 2:</label> <input type="file"
											name="image2File" class="form-control">
									</div>
									<div class="container text-center mt-3">
										<button class="btn btn-outline-primary">Save</button>
									</div>

								</form>
							</div>
						</div>
					</div>
				</div>
			</div>

		</section>
	</section>


</body>
</html>
