<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage News | Admin Panel</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f7f9fc;
      font-family: "Segoe UI", sans-serif;
      padding: 30px;
    }

    .container {
      max-width: 900px;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      font-weight: 600;
      margin-bottom: 25px;
      color: #003366;
    }

    .form-control, .btn {
      border-radius: 10px;
    }

    table {
      margin-top: 30px;
    }

    th {
      background-color: #003366;
      color: white;
    }

    .btn-danger {
      font-size: 0.9rem;
      padding: 5px 12px;
    }
    
    

    .alert {
  transition: opacity 0.5s ease;
  position: sticky;
  top: 10px;
  z-index: 9999;
}

  </style>
</head>
<body>

<section th:fragment="section">

  <div class="container">
    <h2>📰 Manage News</h2>

    <!-- Alert messages -->
<div id="successAlert" class="alert alert-success" style="display: none;">
  News added successfully!
</div>

<div id="deleteAlert" class="alert alert-danger" style="display: none;">
  News deleted successfully!
</div>

    <!-- Add News Form -->
    <form id="addNewsForm" class="row g-3">
      <div class="col-md-3">
        <input type="date" name="date" class="form-control" required>

      </div>
      <div class="col-md-9">
        <input type="text" name="title" class="form-control" placeholder="News Title" required>
      </div>
      <div class="col-12">
        <textarea name="description" class="form-control" placeholder="Description" required></textarea>
      </div>
      
      <div class="col-md-3 d-grid">
        <button type="submit" class="btn btn-primary">Add News</button>
      </div>
    </form>

    <!-- News Table -->
    <table class="table table-bordered table-hover align-middle mt-3" id="newsTable">
      <thead>
        <tr>
          <th width="10%">Date</th>
          <th width="25%">Title</th>
          <th width="45%">Description</th>
          
          <th width="5%">Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  
  
  <!-- News Management Script -->
<script>
  const successAlert = document.getElementById("successAlert");
  const deleteAlert = document.getElementById("deleteAlert");

  // Load news on page load
  document.addEventListener("DOMContentLoaded", loadNews);

  async function loadNews() {
    const res = await fetch('/news/all');
    const data = await res.json();
    const tbody = document.querySelector("#newsTable tbody");

    tbody.innerHTML = data.map(n => `
      <tr>
        <td>${n.date}</td>
        <td>${n.title}</td>
        <td>${n.description}</td>
        <td>
          <button class="btn btn-danger btn-sm" onclick="deleteNews(${n.id})">
            Delete
          </button>
        </td>
      </tr>
    `).join("");
  }

  // Handle Add News form submission
  document.getElementById("addNewsForm").onsubmit = async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const data = Object.fromEntries(form.entries());

    const res = await fetch('/news/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (res.ok) {
      e.target.reset();
      showAlert(successAlert); // ✅ Only shows when added
      loadNews();
    }
  };

  // Delete news by ID
  async function deleteNews(id) {
    if (!confirm("Are you sure you want to delete this news item?")) return;

    const res = await fetch(`/news/delete/${id}`, { method: 'DELETE' });
    if (res.ok) {
      showAlert(deleteAlert); // ✅ Only shows when deleted
      loadNews();
    }
  }

  // Show temporary alert
  function showAlert(alertElement) {
    alertElement.style.display = "block";
    setTimeout(() => {
      alertElement.style.display = "none";
    }, 2000);
  }
</script>
</section>
</body>
</html>
