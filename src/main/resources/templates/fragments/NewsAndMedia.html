<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AVT Fastners Pvt. Ltd.</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
.contact-banner {
    width: 100%;
    height: 60vh;
    min-height: 300px;
    background: url('/img/newsbanner.jpeg') center center / cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* 📱 Mobile Fix */
@media (max-width: 768px) {
    .contact-banner {
        height: 35vh;   /* 👈 decrease height */
        min-height: 200px; /* 👈 prevents too small */
        background-position: top center;
    }
}

.banner-overlay {
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
}

.banner-overlay h1 {
    font-size: 36px;
    font-weight: 700;
}

.banner-overlay p {
    font-size: 16px;
}

</style>

</head>
<body>

<!-- ✅ Contact Banner -->
<div class="contact-banner">
    <div class="banner-overlay">
    </div>
</div>


	<div th:replace="fragments/header :: siteHeader"></div>


<!-- News & Media -->
	<section class="news-media-section">
		<!-- News Section -->
		<div class="news-section" id="news">
			<h2>
				<i class="fas fa-arrow-up-right-from-square"></i> News & Updates
			</h2>
			<div class="news-wrapper">
				<div class="news-list" id="newsList">
					<!-- News items will be injected dynamically -->
				</div>
			</div>
		</div>

		<!-- Media Section -->
		<div class="media-section" id="media">
			<h2>Media</h2>

			<div class="media-video" th:if="${video != null}">
				<!-- Local mp4 -->
				<div
					th:if="${video.videoUrl != null and video.videoUrl.startsWith('/videos/')}">
					<video width="640" height="360" controls>
						<source th:src="@{${video.videoUrl}}" type="video/mp4" />
						Your browser does not support the video tag.
					</video>
				</div>

				<!-- YouTube embed or external iframe URL -->
				<div
					th:if="${video.videoUrl != null and !video.videoUrl.startsWith('/videos/')}">
					<iframe width="640" height="360" th:src="${video.videoUrl}"
						frameborder="0" allowfullscreen></iframe>
				</div>
			</div>

			<div th:unless="${video != null}">
				<p>No video configured</p>
			</div>






			<!-- ✅ Link to more videos page -->
			<div class="more-videos" style="text-align: right; margin-top: 10px;">
				<a th:href="@{/youtube/more}" class="btn-inline-hover"
					style="text-decoration: none;">more</a>
			</div>
		</div>



		</div>
		</div>

	</section>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


	<script>
  let scrollInterval; // Global interval reference

  document.addEventListener("DOMContentLoaded", async () => {
    const newsData = await fetchNews();
    renderNews(newsData);
    startScroll();
  });

  // Fetch news from backend
  async function fetchNews() {
    const res = await fetch('/news/all');
    return await res.json();
  }

  // Render news items dynamically
  function renderNews(newsData) {
    const newsList = document.getElementById("newsList");
    newsList.innerHTML = "";

    newsData.forEach(news => {
      const item = document.createElement("div");
      item.classList.add("news-item");
      item.innerHTML = `
        <div class="news-date">${news.date}</div>
        <div class="news-content">
          <h3>${news.title}</h3>
          <p>${news.description}</p>
          ${news.link ? `<a href="${news.link}" class="news-more" target="_blank">more →</a>` : ""}
        </div>
      `;
      newsList.appendChild(item);
    });

    // Add hover control
    newsList.addEventListener("mouseenter", stopScroll);
    newsList.addEventListener("mouseleave", startScroll);
  }

 // ✅ Start auto-scrolling (seamless infinite loop)
function startScroll() {
  const newsList = document.getElementById("newsList");
  const scrollSpeed = 1; // Adjust speed if needed (1–3 is smooth)
  
  stopScroll(); // Clear any previous intervals before starting new one

  scrollInterval = setInterval(() => {
    // Increment scroll
    newsList.scrollTop += scrollSpeed;

    // ✅ Instantly loop back when near bottom (prevents visual pause)
    if (newsList.scrollTop >= newsList.scrollHeight - newsList.clientHeight - 1) {
      newsList.scrollTop = 0;
    }
  }, 30); // faster refresh for smoother motion
}

  // 🛑 Stop scrolling on hover
  function stopScroll() {
    clearInterval(scrollInterval);
  }
</script>

<script>

document.addEventListener("DOMContentLoaded", function(){

  const menuBtn = document.getElementById("mobile-menu");
  const navList = document.getElementById("nav-list");

  if(menuBtn){
    menuBtn.addEventListener("click", function(){
      navList.classList.toggle("active");
      if(navList.classList.contains("active")){
    document.body.style.overflow = "hidden";   // 🔥 lock scroll
  } else {
    document.body.style.overflow = "auto";     // 🔥 unlock scroll
  }
    });
  }

  /* MOBILE DROPDOWN FIX */

  const dropdownLinks = document.querySelectorAll(".dropdown > a");

  dropdownLinks.forEach(link => {
    link.addEventListener("click", function(e){

      if(window.innerWidth <= 768){

        e.preventDefault();

        const submenu = this.nextElementSibling;

        if(submenu){
          submenu.classList.toggle("show");
        }

      }

    });
  });

});

</script>


</body>
</html>
